[project]
name = "sales-agent"
version = "0.1.0"
description = "AI sales agent for an industrial machinery supplier (Telegram demo, WhatsApp-ready)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.2",
    "openai>=1.55.0",
    "qdrant-client>=1.12.0",
    "supabase>=2.10.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# The system prompt is prose. Wrapping it to 100 cols to satisfy a linter would
# make the single most important text in the repo harder to read and review.
"app/prompts.py" = ["E501"]
# Customer-facing message text — same reasoning. These strings are read as they
# appear in a chat window, so they are written that way.
"app/commands.py" = ["E501"]

[tool.uv]
package = false
